<!doctype html><meta charset="utf-8"><title>纯插件公式验证</title><style>body{font:20px system-ui;padding:35px}button{font:inherit;margin:12px;padding:12px}pre{white-space:pre-wrap}</style>
<h1>纯浏览器公式写入</h1><button id="mathml">标准 MathML</button><button id="omml">Office HTML / OMML</button><button id="custom">Web 自定义 MathML</button><pre id="result"></pre><script>
const math='<math xmlns="http://www.w3.org/1998/Math/MathML"><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mn>2</mn></mfrac></math>';
const omml='<html xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"><body><p>OMML-START <m:oMath><m:f><m:num><m:r><m:t>a+b</m:t></m:r></m:num><m:den><m:r><m:t>2</m:t></m:r></m:den></m:f></m:oMath> OMML-END</p></body></html>';
for(const id of ['mathml','omml','custom'])document.getElementById(id).onclick=async()=>{try{let html=id==='omml'?omml:'<p>MATHML-START '+math+' MATHML-END</p>';if(id==='custom'){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob(['CUSTOM-START (a+b)/2 CUSTOM-END'],{type:'text/plain'}),'web application/mathml+xml':new Blob([math],{type:'application/mathml+xml'})})]);}else{document.addEventListener('copy',e=>{e.preventDefault();e.clipboardData.setData('text/html',html);e.clipboardData.setData('text/plain',id.toUpperCase()+'-START (a+b)/2 END');},{once:true});if(!document.execCommand('copy'))throw Error('copy returned false');}document.getElementById('result').textContent=id+' 已写入';}catch(e){document.getElementById('result').textContent=String(e)}};
</script>
