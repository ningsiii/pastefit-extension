<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>贴妥 Mac 原生公式复制验证</title>
<style>body{font:17px/1.6 sans-serif;max-width:900px;margin:28px auto}td,th{border:1px solid #888;padding:8px}table{border-collapse:collapse}button{font:inherit;padding:8px}</style>
<h1>Mac → Pages 原生公式粘贴试验</h1>
<p>选中样本→右键贴妥编辑→兼容选项选Pages→点击“Pages 可编辑公式（Mac 试验）”。完成一次设置后等成功提示，在Pages普通粘贴。双击分式和矩阵、修改并重开确认。记录表格合并、上下标、列表和首尾。不是图片或下载文件流程。</p>
<button id="select">选中样本</button>
<article id="sample">
<h2>原生复制样本 START333</h2>
<p>正文<strong>粗体</strong>，科学上下标 H<sub>2</sub>O 与 x<sup>2</sup>，行内分式 <span data-math-source="\frac{a+b}{2}">(a+b)/2</span> 与文字混排。</p>
<p>矩阵 <span data-math-source="\begin{pmatrix}a&amp;b\\c&amp;d\end{pmatrix}">(a b; c d)</span>。</p>
<table><tr><th rowspan="2">实验 A</th><th colspan="2">观察结果</th></tr><tr><td>第一段<br>第二段</td><td>表内公式 <span data-math-source="x_i">xi</span></td></tr><tr><td>实验 B</td><td>123</td><td>完成</td></tr></table>
<ol start="3"><li>第三项</li><li>第四项</li></ol><p>末尾 END333。</p>
</article>
<script>document.getElementById('select').onclick=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('sample'));const s=getSelection();s.removeAllRanges();s.addRange(r)};</script></html>
