<template id="scene-chat"><pre class="markdown-source language-markdown"># 猫猫探月小队 · 出发计划

## 1. 登船检查
- **补给官**：装好猫粮和氧气罐
- 清点四只队员，别把队长落在地球

## 2. 月面任务
1. 给月球拍一张全家福
2. 找一块适合晒太阳的石头
3. 带一份月壤，按时回家吃饭

**提醒**：小鱼干是补给，不是飞船燃料。</pre></template>
<template id="scene-document"><h1>月球奶茶实验室</h1><p class="source-tint" style="background-color:#edf2ff;color:#283a9b">今日任务：为探月小队调一杯不会飘走的奶茶。<strong>重点</strong>、<em>强调</em>、H<sub>2</sub>O 与 x<sup>2</sup> 应保留。</p><h2>一、奶茶配方实验</h2><p>两杯快乐的平均值为 <math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mn>2</mn></mfrac><annotation encoding="application/x-tex">\frac{a+b}{2}</annotation></semantics></math>。分母可以改，快乐不能少。</p><table><caption>登月试饮记录（构造样本）</caption><tbody><tr><th rowspan="2">试饮组</th><th colspan="2">观察结果</th></tr><tr><th>记录</th><th>表达式</th></tr><tr><td>珍珠组</td><td><p>珍珠正常漂浮</p><p>小猫请求加糖</p></td><td><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><msub><mi>x</mi><mi>i</mi></msub><annotation encoding="application/x-tex">x_i</annotation></semantics></math></td></tr><tr><td>椰果组</td><td colspan="2">一致建议：给吸管系上安全绳。</td></tr></tbody></table><h3>1.1 出杯前检查</h3><ol start="3"><li>盖好杯盖，防止奶茶逃逸。<ul><li>检查吸管，禁止当作天线。</li></ul></li><li>贴上标签，交给猫猫队长。</li></ol><p>今日配方矩阵：</p><p class="matrix"><math display="block" xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>(</mo><mtable><mtr><mtd><mi>a</mi></mtd><mtd><mi>b</mi></mtd></mtr><mtr><mtd><mi>c</mi></mtd><mtd><mi>d</mi></mtd></mtr></mtable><mo>)</mo></mrow><annotation encoding="application/x-tex">\begin{pmatrix}a&amp;b\\c&amp;d\end{pmatrix}</annotation></semantics></math></p><p>末尾：奶茶已就位，月球等你来。</p></template>
