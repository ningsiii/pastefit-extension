<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="贴妥 PasteFit C2-2 标志">
  <defs>
    <!-- The two panels have intentionally unequal exposed widths and are slightly offset. -->
    <linearGradient id="blue" x1="14" y1="11" x2="90" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CDFFE"/>
      <stop offset=".28" stop-color="#18B9F8"/>
      <stop offset=".67" stop-color="#036FFB"/>
      <stop offset="1" stop-color="#0341EE"/>
    </linearGradient>
    <linearGradient id="blueDepth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset=".42" stop-color="#9DEBFF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0031DD" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="orange" x1="0.15" y1="0" x2="0.93" y2="1">
      <stop offset="0" stop-color="#FFE580"/>
      <stop offset=".33" stop-color="#FFB12C"/>
      <stop offset=".70" stop-color="#FF891A"/>
      <stop offset="1" stop-color="#FF5D32"/>
    </linearGradient>
    <linearGradient id="orangeHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6BE" stop-opacity=".70"/>
      <stop offset=".40" stop-color="#FFF6BE" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF3F36" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.02" y1="0.18" x2="1" y2="0.82">
      <stop offset="0" stop-color="#8ECBFE"/>
      <stop offset=".33" stop-color="#BAD8FB"/>
      <stop offset=".67" stop-color="#E5E6EE"/>
      <stop offset="1" stop-color="#FFF3D2"/>
    </linearGradient>
    <linearGradient id="glassGlint" x1="0" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset=".70" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".46"/>
    </linearGradient>
    <path id="blueShape" d="M 30,4 H 79 C 92.8,4 100,11.5 100,25.4 V 80.5 C 100,93.7 93,100.2 79,100.2 H 26.6 C 12.1,100.2 4,91.1 4,77.7 V 30.9 C 4,15.3 15,4 30,4 Z"/>
    <path id="orangeShape" d="M 52.7,32 H 98.6 C 114.8,32 124,43.6 124,58.2 V 98.3 C 124,113.3 113.1,124 98.1,124 H 54.1 C 39.2,124 32,114.4 32,101.9 V 53.5 C 32,40.1 40.5,32 52.7,32 Z"/>
    <!-- The asymmetric curved glass seam is the primary identifying feature. -->
    <path id="glassShape" d="M 32,69.5 C 32,46.2 48,34 72.5,33.2 L 100,32.2 L 100,69.3 C 100,90 85.6,97.5 66.4,98.5 L 32,101.1 Z"/>
    <clipPath id="blueClip"><use href="#blueShape"/></clipPath>
    <clipPath id="orangeClip"><use href="#orangeShape"/></clipPath>
  </defs>

  <use href="#blueShape" fill="url(#blue)"/>
  <!-- Highlights follow the shape instead of adding a container background. -->
  <path d="M 6,69 L 6,31 C 6,15.2 16,6 31,6 H 78 C 90,6 98,14 98,26" clip-path="url(#blueClip)"
        fill="none" stroke="#ACF8FF" stroke-width="1.15" opacity=".35"/>

  <use href="#orangeShape" fill="url(#orange)"/>
  <path d="M 35,51 C 35,41 43,35 53,35 H 97.5 C 112.7,35 121,45 121,59" clip-path="url(#orangeClip)"
        fill="none" stroke="#FFF4A9" stroke-width="2" opacity=".47"/>
  <!-- Recover the blue crescent above the central glass: no unwanted orange wedge. -->
  <path d="M 32,31.8 H 100 L 100,32.2 L 72.5,33.2 C 48,34 32,46.2 32,69.5 Z" fill="url(#blue)"/>
  <path d="M 39,119.8 C 45,122 49.5,122.5 56,122.5 H 97.2 C 111.4,122.5 122,113.2 122,99"
        fill="none" stroke="#FFC76D" stroke-width="1.1" opacity=".34"/>

  <!-- Clean, luminous overlap: the glass is not a muddy color blend. -->
  <use href="#glassShape" fill="url(#glass)" fill-opacity=".985"/>
  <use href="#glassShape" fill="url(#glassGlint)"/>
  <path d="M 32.8,70 C 32.8,47 48.6,35 72.6,34.2 L 99.1,33.3"
        fill="none" stroke="#FFFFFF" stroke-width="1.7" opacity=".73"/>
  <path d="M 99.2,69.5 C 99.2,90 84.8,96.5 66.5,97.5 L 32.7,100.2"
        fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".85"/>
  <path d="M 33,71.5 L 33,99" fill="none" stroke="#BFE4FF" stroke-width=".8" opacity=".60"/>
</svg>
